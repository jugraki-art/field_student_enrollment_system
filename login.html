<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Field Student Enrollment System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <h2>Kinondoni Municipal Council HQ</h2>
            <p>Field Student Enrollment Portal</p>
        </div>

        <div id="loginAlert" class="login-alert" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username / Official Email</label>
                <input type="text" id="username" required placeholder="e.g. training.officer" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="submit" id="loginBtn" class="btn btn-primary" style="margin-top: 0;">Sign In</button>
                <button type="button" id="registerBtn" class="btn btn-secondary" style="width: 100%;">Register</button>
            </div>
        </form>

        <div class="login-footer">
            <p>Restricted to authorized Training Officers & IT Staff.</p>
        </div>
        <div class="login-footer">
            <p>Restricted to authorized Training Officers & IT Staff.</p>
            <p><small>Default credentials: <strong>admin</strong> / <strong>admin123</strong></small></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
